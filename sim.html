<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RP Visual Field Prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="panel">
  <header id="panelHead">
    <span class="title">Simulation</span>
    <button class="chev" aria-label="Toggle settings">Done</button>
  </header>
  <div class="body">
    <div class="seg tabs">
      <button id="tabGen" class="on">General</button>
      <button id="tabSym">Adjust Symptoms</button>
    </div>
    <div id="tabGeneral">
      <label>Degeneration of central field</label>
      <input type="range" id="sDegen" min="0" max="1" step="0.01">
      <label>Background</label>
      <div class="seg">
        <button id="bgCam" class="on">Camera</button>
        <button id="bgVid">Video</button>
      </div>
      <button id="camFlip" hidden>⟲ Flip camera</button>
      <label>View</label>
      <div class="seg">
        <button id="vwImm" class="on">Immersive</button>
        <button id="vwSbs">Side-by-side</button>
      </div>
    </div>
    <!-- keeps the id "adv": every symptom-panel style rule is scoped
         to it, and the generated content is oblivious to the move -->
    <div id="adv" hidden>
      <div class="ghead">Load presets</div>
      <!-- options filled by controls.js from presets/index.json -->
      <select id="presetSel"></select>
      <div class="seg">
        <button id="presetSave">Save as preset</button>
        <button id="presetLoad">Load file…</button>
      </div>
      <input type="file" id="presetFile" accept=".json,application/json" hidden>
      <div class="ghead">Configure symptoms</div>
      <!-- filled by controls.js from the schema (config.js) -->
      <div id="advBody"></div>
    </div>
  </div>
</div>
<div id="note">starting…</div>
<video id="cam" autoplay playsinline muted style="display:none"></video>
<!-- openly licensed footage, self-hosted: see assets/CREDITS.md -->
<video id="vid" src="assets/shanghai-walk.mp4" loop muted playsinline
       preload="metadata" style="display:none"></video>
<script type="module" src="renderer.js"></script>
</body>
</html>
